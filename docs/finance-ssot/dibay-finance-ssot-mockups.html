<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DIBAY 금융 SSOT 시안 — 회원·오너·관리자</title>
<style>
  :root {
    --g: #0B421A; --g-strong: #0A3A17; --g-soft: #E9EBE7; --g-border: #C9D3CB;
    --cream: #FFFCFC; --card: #FFFFFF; --subtle: #FCF6EE;
    --fg: #362415; --fg2: #604C4C; --fg3: #837373; --border: rgba(54,36,21,.14);
    --ok: #21885d; --ok-soft: #E9F3EE; --warn: #896F48; --warn-soft: #F7E8CE;
    --bad: #d45252; --bad-soft: #fdf0f0; --r: 4px;
    --a-fg: #1d2939; --a-fg2: #667085; --a-fg3: #98a2b3; --a-border: #e4e7ec; --a-bg: #f6f7f9;
    --pin: #e8590c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif; color: var(--fg); background: #ECEAE6; font-size: 14px; }
  body.en .ko { display: none !important; } body:not(.en) .en { display: none !important; }
  .top { position: sticky; top: 0; z-index: 50; background: var(--g); color: var(--cream); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .top h1 { font-size: 15px; margin: 0 16px 0 0; font-weight: 600; }
  .top .meta { font-size: 12px; opacity: .8; margin-right: auto; }
  .nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 20px; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 44px; z-index: 49; }
  .nav button, .top button { min-height: 44px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--border); background: #fff; color: var(--fg); font-size: 13px; cursor: pointer; }
  .nav button.on { background: var(--g); color: var(--cream); border-color: var(--g); }
  .top button { background: transparent; color: var(--cream); border-color: rgba(255,252,252,.4); }
  section.page { display: none; padding: 20px; } section.page.on { display: block; }
  .intro { max-width: 1180px; background: #fff; border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; margin-bottom: 16px; line-height: 1.55; font-size: 13px; }
  .intro b { color: var(--g); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .cap { font-size: 12px; color: var(--fg2); margin: 0 0 6px; font-weight: 600; }
  /* phone */
  .phone { width: 390px; background: var(--cream); border: 1px solid #cfc9c2; border-radius: 28px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.08); position: relative; }
  .sb { height: 28px; font-size: 12px; display: flex; justify-content: space-between; padding: 6px 22px 0; color: var(--fg); }
  .hdr { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--cream); border-bottom: 1px solid var(--border); }
  .hdr .back { width: 44px; height: 44px; display: grid; place-items: center; font-size: 20px; }
  .hdr .t { font-size: 17px; font-weight: 600; }
  .body { padding: 12px 16px 96px; min-height: 640px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
  .bal { background: var(--g); color: var(--cream); border: 0; }
  .bal .lb { font-size: 13px; opacity: .85; } .bal .amt { font-size: 28px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -.3px; }
  .bal .sub { font-size: 12px; opacity: .8; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btn { min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--g); background: var(--g); color: var(--cream); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; flex: 1; }
  .btn.sec { background: var(--card); color: var(--g); border-color: var(--g-border); }
  .bal .btn { background: var(--cream); color: var(--g); border-color: var(--cream); }
  .bal .btn.sec { background: transparent; color: var(--cream); border-color: rgba(255,252,252,.5); }
  .btn.pressed { background: var(--g-strong); }
  .btn.loading { opacity: .9; } .btn.loading::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,252,252,.4); border-top-color: var(--cream); animation: sp 1s linear infinite; }
  .btn.dis { background: #cfd6d0; border-color: #cfd6d0; color: #fff; cursor: not-allowed; }
  .btn.done { background: var(--ok); border-color: var(--ok); }
  .btn.err { background: var(--bad); border-color: var(--bad); }
  .btn.danger { background: var(--card); color: var(--bad); border-color: var(--bad); }
  @keyframes sp { to { transform: rotate(360deg); } }
  .lrow { display: flex; align-items: center; min-height: 44px; justify-content: space-between; border-top: 1px solid var(--border); font-size: 13px; }
  .lrow:first-child { border-top: 0; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; }
  .chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; }
  .chip.on { background: var(--g); color: var(--cream); border-color: var(--g); }
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .tab { flex: 1; min-height: 44px; display: grid; place-items: center; font-size: 14px; color: var(--fg2); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--g); border-bottom-color: var(--g); font-weight: 600; }
  .day { font-size: 12px; color: var(--fg3); margin: 12px 0 4px; }
  .tx { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); min-height: 56px; }
  .tx .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--g-soft); color: var(--g); font-size: 13px; font-weight: 700; flex: none; }
  .tx .mid { flex: 1; min-width: 0; } .tx .ti { font-size: 14px; font-weight: 600; } .tx .st { font-size: 12px; color: var(--fg2); margin-top: 2px; }
  .tx .rt { text-align: right; } .tx .am { font-size: 15px; font-weight: 700; } .tx .ba { font-size: 11px; color: var(--fg3); margin-top: 2px; }
  .plus { color: var(--g); } .minus { color: var(--fg); }
  .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .b-ok { background: var(--ok-soft); color: var(--ok); } .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-bad { background: var(--bad-soft); color: var(--bad); } .b-info { background: var(--g-soft); color: var(--g); } .b-mute { background: #f0eeec; color: var(--fg2); }
  .sheet-wrap { position: absolute; inset: 80px 0 0 0; background: rgba(54,36,21,.35); display: flex; align-items: flex-end; }
  .sheet { background: var(--card); width: 100%; border-radius: 16px 16px 0 0; padding: 8px 16px 20px; }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: #d9d3cc; margin: 4px auto 10px; }
  .sheet h3 { font-size: 16px; margin: 0 0 4px; } .sheet .big { font-size: 26px; font-weight: 700; margin: 6px 0 10px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; min-height: 36px; align-items: center; border-top: 1px solid var(--border); font-size: 13px; }
  .kv span:first-child { color: var(--fg2); flex: none; } .kv span:last-child { text-align: right; word-break: break-word; flex: 1; min-width: 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .note { font-size: 12px; color: var(--fg2); line-height: 1.5; }
  .notice { border-radius: var(--r); padding: 12px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
  .n-info { background: var(--g-soft); } .n-ok { background: var(--ok-soft); } .n-warn { background: var(--warn-soft); } .n-bad { background: var(--bad-soft); }
  .notice .nt { font-weight: 700; margin-bottom: 2px; } .notice .ref { font-size: 11px; color: var(--fg3); margin-top: 6px; }
  .sticky { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--border); padding: 10px 16px 22px; }
  .plan { border: 1px solid var(--border); border-radius: var(--r); padding: 12px; display: flex; justify-content: space-between; align-items: center; min-height: 56px; margin-bottom: 8px; background: var(--card); }
  .plan.on { border-color: var(--g); box-shadow: inset 0 0 0 1px var(--g); }
  .pin { position: relative; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--pin); color: #fff; font-size: 10px; font-weight: 700; margin-left: 4px; vertical-align: middle; cursor: help; }
  .side { max-width: 360px; font-size: 12.5px; line-height: 1.55; }
  .side .it { background: #fff; border: 1px solid var(--border); border-left: 3px solid var(--pin); border-radius: var(--r); padding: 8px 10px; margin-bottom: 8px; }
  .side .it b { color: var(--pin); }
  .side .it .cur { color: var(--fg2); }
  .stateStrip { display: flex; flex-wrap: wrap; gap: 8px; max-width: 840px; }
  .stateStrip .btn { flex: 0 0 150px; }
  /* dialog */
  .dlg-wrap { position: absolute; inset: 80px 0 0 0; background: rgba(54,36,21,.35); display: grid; place-items: center; padding: 20px; }
  .dlg { background: var(--card); border-radius: 12px; padding: 18px; width: 100%; }
  .dlg h3 { margin: 0 0 10px; font-size: 16px; }
  /* tablet */
  .tablet { width: 1024px; background: var(--cream); border: 1px solid #cfc9c2; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .tablet .split { display: grid; grid-template-columns: 1fr 380px; min-height: 560px; }
  .tablet .split > div { padding: 14px 18px; } .tablet .split > div + div { border-left: 1px solid var(--border); background: var(--card); }
  /* admin */
  .admin { width: 1240px; background: var(--a-bg); color: var(--a-fg); border: 1px solid #d0d5dd; border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: 220px 1fr; box-shadow: 0 6px 24px rgba(0,0,0,.08); position: relative; }
  .admin .sbar { background: #fff; border-right: 1px solid var(--a-border); padding: 12px 0; font-size: 13px; }
  .admin .sbar .grp { color: var(--a-fg3); font-size: 11px; padding: 10px 16px 4px; font-weight: 600; }
  .admin .sbar a { display: flex; align-items: center; min-height: 36px; padding: 0 16px; color: var(--a-fg); text-decoration: none; }
  .admin .sbar a.on { background: var(--g-soft); color: var(--g); font-weight: 600; border-right: 3px solid var(--g); }
  .admin .main { padding: 16px 20px; min-width: 0; }
  .admin h2 { font-size: 18px; margin: 0 0 4px; } .admin .desc { color: var(--a-fg2); font-size: 12.5px; margin-bottom: 12px; }
  .abtn { min-height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--a-border); background: #fff; color: var(--a-fg); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .abtn.pri { background: var(--g); color: #fff; border-color: var(--g); } .abtn.dng { color: var(--bad); border-color: #f2b8b8; } .abtn.dis { opacity: .45; cursor: not-allowed; }
  .afil { display: flex; gap: 8px; flex-wrap: wrap; background: #fff; border: 1px solid var(--a-border); border-radius: 8px; padding: 10px; margin-bottom: 12px; align-items: center; font-size: 13px; }
  .afil .seg { display: inline-flex; border: 1px solid var(--a-border); border-radius: 6px; overflow: hidden; }
  .afil .seg span { padding: 8px 12px; border-right: 1px solid var(--a-border); } .afil .seg span:last-child { border-right: 0; } .afil .seg span.on { background: var(--g); color: #fff; }
  .afil input { height: 36px; border: 1px solid var(--a-border); border-radius: 6px; padding: 0 10px; font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
  .kpi { background: #fff; border: 1px solid var(--a-border); border-radius: 8px; padding: 10px 12px; } .kpi .k { color: var(--a-fg2); font-size: 12px; } .kpi .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
  table.at { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--a-border); border-radius: 8px; overflow: hidden; font-size: 12.5px; }
  .at th { text-align: left; background: #f9fafb; color: var(--a-fg2); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--a-border); white-space: nowrap; }
  .at td { padding: 8px 10px; border-bottom: 1px solid var(--a-border); vertical-align: middle; }
  .at tr.sel td { background: #f3f7f4; } .at td.r { text-align: right; font-variant-numeric: tabular-nums; }
  .w { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .w-P { background: #eef4ff; color: #3538cd; } .w-C { background: var(--g-soft); color: var(--g); } .w-K { background: #fef6e7; color: #93640c; }
  .adet { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .apanel { background: #fff; border: 1px solid var(--a-border); border-radius: 8px; padding: 12px 14px; font-size: 13px; }
  .apanel h4 { margin: 0 0 8px; font-size: 13px; } .apanel .kv { min-height: 30px; border-color: var(--a-border); } .apanel .kv span:first-child { color: var(--a-fg2); }
  .alink { color: var(--g); text-decoration: underline; cursor: pointer; }
  .adlg-wrap { position: absolute; inset: 0; background: rgba(16,24,40,.45); display: grid; place-items: center; }
  .adlg { width: 520px; background: #fff; border-radius: 10px; padding: 18px 20px; box-shadow: 0 20px 40px rgba(0,0,0,.2); }
  .adlg h3 { margin: 0 0 4px; font-size: 16px; } .lv { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; background: var(--bad-soft); color: var(--bad); margin-left: 6px; }
  .adlg textarea, .adlg input { width: 100%; border: 1px solid var(--a-border); border-radius: 6px; padding: 8px 10px; font-size: 13px; margin-top: 4px; }
  /* tables in docs */
  table.doc { border-collapse: collapse; background: #fff; font-size: 12.5px; width: 100%; max-width: 1400px; }
  .doc th, .doc td { border: 1px solid var(--border); padding: 6px 8px; vertical-align: top; text-align: left; }
  .doc th { background: var(--g); color: var(--cream); font-weight: 600; position: sticky; top: 104px; }
  .doc td.ok { color: var(--ok); font-weight: 600; } .doc td.bad { color: var(--bad); font-weight: 600; } .doc td.np { color: var(--warn); font-weight: 600; }
  .doc tr.grp td { background: var(--g-soft); font-weight: 700; color: var(--g); }
  .own { background: #fff4e6; }
  h2.sec { font-size: 16px; margin: 22px 0 8px; color: var(--g); }
</style>
</head>
<body>
<div class="top">
  <h1>DIBAY 금융 SSOT 시안</h1>
  <span class="meta"><span class="ko">기준: 브랜치 cursor/apple-iap-topup · 4d756ba25 · 라이트 모드 · 시안(실제 화면 아님) · 모든 이름·금액·번호는 예시 데이터</span><span class="en">Base: branch cursor/apple-iap-topup · 4d756ba25 · light mode · mockup (not live screens) · all names, amounts and IDs are sample data</span></span>
  <button type="button" id="langBtn">한국어 / English</button>
</div>
<div class="nav" id="nav"></div>
<div id="pages"></div>

<script>
const L = (ko, en) => `<span class="ko">${ko}</span><span class="en">${en}</span>`;
const pin = (id) => `<span class="pin" title="${id}">${id.replace(/^[A-Z]+-/, "")}</span>`;
const phone = (title, inner, extra = "") => `<div class="phone"><div class="sb"><span>9:41</span><span>●●● 5G ▮</span></div><div class="hdr"><span class="back">‹</span><span class="t">${title}</span></div><div class="body">${inner}</div>${extra}</div>`;
const tx = (ic, ti, st, am, ba, cls = "minus") => `<div class="tx"><div class="ic">${ic || (cls === "plus" ? "+" : "−")}</div><div class="mid"><div class="ti">${ti}</div><div class="st">${st}</div></div><div class="rt"><div class="am ${cls}">${am}</div><div class="ba">${ba}</div></div></div>`;
const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
const side = (items) => `<div class="side">${items.map(([id, cur, fix]) => `<div class="it"><b>${id}</b> <span class="cur">${L("현재", "Now")}: ${cur}</span><br/>→ ${fix}</div>`).join("")}</div>`;
const fig = (cap, html) => `<div><p class="cap">${cap}</p>${html}</div>`;

const PAGES = [];

/* ───────────── 0. 연결표 ───────────── */
PAGES.push({ id: "map", label: L("① 연결표", "① Ledger map"), html: `
<div class="intro">${L(
  "<b>같은 거래 = 같은 원장 행.</b> 회원·오너·관리자 화면은 모두 아래 원장 테이블을 읽는다(코드 확인). 화면이 원장에 없는 금액·잔액을 만들지 않는다. 「이후 잔액」은 원장 컬럼 <span class='mono'>balance_after / balance_after_minor</span> 값만 쓴다. 판정 열은 <b>코드 근거</b>이며 실제 화면 일치는 NOT_PROVEN.",
  "<b>Same transaction = same ledger row.</b> Member, owner and admin screens all read the ledger tables below (verified in code). Screens never invent amounts or balances. \"Balance after\" uses only the ledger columns <span class='mono'>balance_after / balance_after_minor</span>. Verdicts are <b>code evidence</b>; live-screen match is NOT_PROVEN.")}</div>
<table class="doc">
<tr><th>${L("거래","Transaction")}</th><th>${L("원장 · 구분","Ledger · kind")}</th><th>${L("참조 (related_type / id)","Reference")}</th><th>${L("요청·기록 테이블","Request / record")}</th><th>${L("회원·오너 화면","Member / owner screen")}</th><th>${L("관리자 화면","Admin screen")}</th><th>${L("코드 판정","Code verdict")}</th></tr>
<tr class="grp"><td colspan="7">Point — ${L("회원","member")} · point_ledger (${L("잔액 = SUM(amount)","balance = SUM(amount)")})</td></tr>
<tr><td>${L("계좌·GCash 충전","Bank/GCash top-up")}</td><td>charge</td><td>point_charge / ${L("충전요청 id","request id")}</td><td>point_charge_requests</td><td>/mypage/points ${L("충전 탭·내역","charges tab · history")}</td><td>/admin/point-charges, /admin/points/ledger</td><td class="ok">${L("연결됨","Linked")}</td></tr>
<tr class="own"><td>${L("Apple 충전 (신규)","Apple top-up (new)")}</td><td>charge</td><td>point_charge / ${L("충전요청 id","request id")} · idem <span class="mono">apple:&lt;txid&gt;</span></td><td>apple_iap_transactions → point_charge_requests(apple_iap)</td><td>${L("내역 — 단 「입금 확인 완료」로 표시","History — but shown as \"deposit confirmed\"")} ${pin("M-1")}</td><td>${L("Apple 화면과 충전 목록 사이 링크 없음","No link between Apple page and charge list")} ${pin("A-1")}</td><td class="bad">${L("표시 결함","Display defect")}</td></tr>
<tr><td>${L("관리자 지급·차감","Admin credit / debit")}</td><td>admin_credit / admin_debit</td><td>admin_manual</td><td>audit_logs</td><td>${L("관리자 지급/차감 + 사유","Admin credit/debit + reason")}</td><td>/admin/points/ledger (${L("처리자 id","actor id")})</td><td class="ok">${L("연결됨","Linked")}</td></tr>
