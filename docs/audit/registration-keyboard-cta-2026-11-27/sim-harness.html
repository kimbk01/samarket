<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#f4f5f2}
.root{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
.panel{display:flex;flex-direction:column;width:100%;max-width:320px;max-height:var(--maxh);overflow:hidden;border-radius:16px;background:#fff;border:1px solid #e5e7e8;padding:24px 20px 20px}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto}
.logo{width:52px;height:52px;border-radius:12px;background:#0B421A;margin:0 auto}
h1{margin:12px 0 0;text-align:center;font-size:20px;line-height:1.4;font-weight:700;color:#3b2a1e}
.desc{margin:8px 0 0;text-align:center;font-size:16px;line-height:1.6;color:#7a7066}
.icon{width:72px;height:72px;border-radius:50%;background:#e6efe8;margin:0 auto}
.guide{font-size:14px;line-height:1.5;color:#888;text-align:center;margin-top:8px}
.row{height:56px;border-bottom:1px solid #e5e7e8;display:flex;align-items:center;padding:0 4px;font-size:16px;font-weight:600;color:#0B421A}
.num{height:56px;border-bottom:2px solid #0B421A;display:flex;align-items:center;font-size:18px}
.num input{border:0;outline:0;font-size:18px;flex:1;min-width:0}
.pill{margin-top:20px;height:52px;border-radius:999px;background:#0B421A;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
.esc{margin-top:20px;border-top:1px solid #e5e7e8;padding-top:16px;font-size:12px;color:#888}
.links{display:flex;gap:16px;margin-top:8px}.links span{min-height:44px;display:inline-flex;align-items:center;color:#0B421A;text-decoration:underline;font-weight:500;font-size:14px}
.kb{position:fixed;left:0;right:0;bottom:0;background:#d1d4d9;border-top:1px solid #aaa;display:flex;align-items:center;justify-content:center;font-size:18px;color:#555;z-index:9}
.lbl{position:fixed;top:4px;left:4px;z-index:10;background:#c00;color:#fff;font-size:11px;padding:2px 6px}
</style></head><body>
<div class="lbl" id="lbl"></div>
<div class="root"><div class="panel"><div class="scroll" id="sc">
<div class="logo"></div><h1>전화번호 인증</h1>
<p class="desc">가입을 마치려면 휴대폰 번호를 인증해 주세요. 필리핀·한국 번호를 인증할 수 있어요.</p>
<div style="margin-top:24px"><div style="padding-bottom:24px"><div class="icon"></div><div class="guide">관리자 안내 문구(설정 guide_text) 또는 기본 안내 문구가 이 자리에 2줄 표시</div></div>
<div style="border-top:1px solid #e5e7e8"><div class="row">🇵🇭 필리핀 ›</div><div class="num"><span style="width:56px;padding-left:4px">+63</span><span style="width:1px;height:28px;background:#e5e7e8;margin-right:12px"></span><input id="in" placeholder="휴대폰 번호를 입력하세요" value="0917 123 4567"></div></div>
<div class="pill" id="cta">계속</div></div>
<div class="esc">가입을 마치면 앱을 이용할 수 있어요. 다른 계정으로 로그인하려면 로그아웃해 주세요.<br>다른 나라 번호이거나 인증번호가 오지 않으면 고객센터로 문의해 주세요.<div class="links"><span>고객센터</span><span>로그아웃</span></div></div>
</div></div></div>
<div class="kb" id="kb" style="display:none">키보드</div>
<script>
const p=new URLSearchParams(location.search);const mode=p.get('m');
const H=innerHeight;let maxh=Math.min(H-32,640);
if(mode==='android'){maxh=Math.min(H-32,H-32);} // adjustResize: viewport already shrunk
if(mode==='ios'){const kb=+p.get('kb');const vv=H-kb;maxh=Math.min(H-32,vv-32);const k=document.getElementById('kb');k.style.display='flex';k.style.height=kb+'px';}
document.documentElement.style.setProperty('--maxh',maxh+'px');
requestAnimationFrame(()=>{const sc=document.getElementById('sc'),inp=document.getElementById('in');
 // focus-visibility: bring input bottom to band bottom - 16 (band = visible bottom)
 const bandBottom = mode==='ios'? (H-(+p.get('kb'))) : H; const r=inp.getBoundingClientRect(); const need=r.bottom-(bandBottom-16); if(mode&&need>0) sc.scrollTop+=need;
 const c=document.getElementById('cta').getBoundingClientRect(), pr=document.querySelector('.panel').getBoundingClientRect();
 const visibleBottom=Math.min(pr.bottom-20, bandBottom);
 document.getElementById('lbl').textContent=`${mode||'closed'} vp=${innerWidth}x${H} panelMaxH=${maxh} input.bottom=${Math.round(inp.getBoundingClientRect().bottom)} CTA top=${Math.round(c.top)} bottom=${Math.round(c.bottom)} visibleBottom=${Math.round(visibleBottom)} → CTA ${c.bottom<=visibleBottom?'보임':'가려짐'} · 스크롤높이=${sc.scrollHeight}`;
});
</script></body></html>
