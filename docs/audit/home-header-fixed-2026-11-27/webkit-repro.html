<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;flex:1}
#vr{display:flex;flex-direction:column;height:100dvh;max-height:100dvh;overflow:hidden}
.h{overflow:hidden}.ax{overflow-x:hidden;overflow-y:auto;position:relative;transform:matrix(1,0,0,1,0,0)}
.push{position:relative;transform:matrix(1,0,0,1,0,0);will-change:transform}
.host{overflow:hidden;position:relative;isolation:isolate}
main.body{flex:1 1 0%;min-height:0;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;position:relative;z-index:0;padding-bottom:80px;background:#F3F5F3}
.home{container:homer3/inline-size;min-height:100%}
.hdr{background:#f3f5f3}
body.st .hdr{position:sticky;top:0;z-index:10}
.row{height:58px;display:flex;align-items:center;padding:0 16px;font-weight:800;font-size:22px;color:#0B421A}
.card{height:180px;margin:12px 16px;background:#fff;position:relative}
.card i{position:absolute;z-index:2;left:8px;top:8px;font-style:normal}
#out{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#000;color:#0f0;font:bold 15px monospace;padding:8px;white-space:pre}
</style></head><body>
<div class="col"><div id="vr"><div class="col h"><div class="col ax"><div class="col ax"><div class="col h" style="display:flex">
<main class="col" style="position:relative;z-index:0"><div class="col host"><div class="col push">
<main class="body" id="sb"><div style="margin:0 auto;width:100%;min-width:0"><div class="home">
<header class="hdr" id="hd"><div class="row">dibaY HEADER</div></header>
<div id="c"></div></div></div></main></div></div></main></div></div></div></div></div></div>
<div id="out"></div>
<script>
if(location.search.includes('sticky=1'))document.body.classList.add('st');
const c=document.getElementById('c');for(let i=0;i<14;i++){c.insertAdjacentHTML('beforeend','<div class="card"><i>card '+i+'</i></div>')}
const sb=document.getElementById('sb'),hd=document.getElementById('hd'),out=document.getElementById('out');
let auto='';
function show(){out.textContent=(document.body.classList.contains('st')?'STICKY':'CURRENT')+' pos='+getComputedStyle(hd).position+'\nscrollTop='+Math.round(sb.scrollTop)+' headerTop='+Math.round(hd.getBoundingClientRect().top)+'\n'+auto+'\n'+navigator.userAgent.slice(0,60)}
sb.addEventListener('scroll',show,{passive:true});
setTimeout(()=>{sb.scrollTop=600;requestAnimationFrame(()=>requestAnimationFrame(()=>{const t=Math.round(hd.getBoundingClientRect().top);const topHit=document.elementFromPoint(100,20);auto='auto@600: headerTop='+t+' topHitHeader='+!!(topHit&&topHit.closest('#hd'))+' sh='+sb.scrollHeight;show()}))},500);
show();
</script></body></html>
