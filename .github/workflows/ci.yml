name: CI

# 정본: AGENTS.md 「개발 프로세스」 (Owner 2026-11-11 5단계). 검사는 삭제하지 않고 실행 시점·job 수만 나눈다.
# - PR → main / push main 에서만 실행 (작업 브랜치 push 는 실행하지 않음).
# - 결과 집계 job `ci-ok` (경로 조건으로 skipped 된 job 은 통과로 집계).
# - 문서만 바뀐 경우도 건너뛰지 않는다: vitest 21개 파일·verify-call-messenger-restore-hard-lock 이 docs/·AGENTS.md·.cursor/rules 를 읽는다.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  # main push 는 끝까지 유지. PR 은 새 커밋이 앞 실행을 취소.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.c.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: c
        name: Classify changed paths (no third-party action)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          full() { printf 'android=true\n' >> "$GITHUB_OUTPUT"; echo "[changes] $1 → android=true"; exit 0; }
          # main 으로 가는 PR 은 항상 전체 검사
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then full "PR to main"; fi
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE_SHA"; else base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ -z "${base//0/}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then full "base unknown"; fi
          # PR 은 checkout 된 merge ref(HEAD) 기준 → 병합이 실제로 들이는 변경만
          files="$(git diff --name-only --no-renames "$base" HEAD)"
          if [ -z "$files" ]; then full "empty diff"; fi
          android=false
          if printf '%s\n' "$files" | grep -E '^(android/|lib/notifications/contracts/|capacitor\.config\.ts$|package(-lock)?\.json$|scripts/sync-capacitor-vercel\.mjs$|\.github/workflows/ci\.yml$)' >/dev/null; then android=true; fi
          printf 'android=%s\n' "$android" >> "$GITHUB_OUTPUT"
          echo "[changes] base=${base:0:9} files=$(printf '%s\n' "$files" | wc -l) android=$android"

  # 계약 검사 + 타입검사(typecheck:test 1회 — typecheck:build 범위 포함, verify:deploy-authority 가 전제 검사) + lint
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # C1·C2 (Owner 2026-11-11 「CI 시간 개선」): 검사 범위·규칙은 그대로, 직전 결과만 재사용한다.
      # - ESLint: --cache-strategy content (파일 내용 해시) · 규칙에 파일 간·타입 정보 규칙 없음 → 파일 단위 재사용 안전.
      # - tsc -b: .tsbuild 의 파일 해시로 바뀐 파일·영향 파일만 다시 검사 (오류 판정 동일).
      # - 키 = 의존성·설정 해시 + 커밋. 의존성·eslint·tsconfig 가 바뀌면 이전 캐시를 쓰지 않는다(restore-keys 도 같은 해시 접두).
      # - actions/cache 는 작업이 성공했을 때만 저장한다 → 실패한 실행의 결과는 남지 않는다.
      - name: Restore lint / typecheck result caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/eslint
            .tsbuild
          key: static-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            static-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig*.json') }}-
      - name: Static checks (contracts, typecheck, lint — no next build)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run ci:static

  # vitest 2개 shard 병렬 (기존 test:ci 의 --shard=1/2 && --shard=2/2 와 같은 테스트 집합)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: test (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: vitest shard ${{ matrix.shard }}/2
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx vitest run --shard=${{ matrix.shard }}/2

  # HARD LOCK C2·C6 (docs/audit/notification-system-ssot-hardlock-reaudit-2026-11-01.md §4) — 기존과 같은 4개 JVM 테스트.
  # android/·알림 기준표(lib/notifications/contracts/)·Capacitor 설정·의존성·이 워크플로가 바뀔 때, 그리고 main 으로 가는 PR 에서는 항상.
  # 통화 JVM 테스트 3건 제외는 기존 그대로 (통화 규정상 별도 승인 대상).
  android-notification-contract:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - name: Capacitor sync (generates android/capacitor-cordova-android-plugins)
        run: npm run cap:sync:vercel
      - name: Android notification route contract tests
        working-directory: android
        run: >-
          ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" testDebugUnitTest
          --tests 'com.dibay.app.NotificationRouteContractTest'
          --tests 'com.dibay.app.FcmPayloadResolverTest'
          --tests 'com.dibay.app.DibayAppRouteGuardTest'
          --tests 'com.dibay.app.PushRouteAckMatchContractTest'

  # [배포 구분] 출력 + 빌드 번호 역행·iOS 4곳 불일치만 실패 (기존 그대로). PR 은 GITHUB_BASE_REF(main) 기준.
  native-version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify native build number bump
        run: npm run verify:native-version-bump

  # rulesets 의 유일한 필수 검사. skipped 는 통과, failure·cancelled 는 실패.
  ci-ok:
    if: always()
    needs: [changes, static, test, android-notification-contract, native-version-bump]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const n = JSON.parse(process.env.NEEDS);
            const bad = Object.entries(n).filter(([, v]) => !["success", "skipped"].includes(v.result));
            for (const [k, v] of Object.entries(n)) console.log(`${k}: ${v.result}`);
            if (n.changes.result !== "success") { console.error("changes job must succeed"); process.exit(1); }
            if (bad.length) process.exit(1);
          '
