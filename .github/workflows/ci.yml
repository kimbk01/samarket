name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks (types, lint, test, contracts — no next build)
        # ubuntu-latest default Node heap OOMs on full `npm run ci` → exit 134 (SIGABRT).
        # Match local build memory budget; this is infra, not a product-contract gate.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run ci

