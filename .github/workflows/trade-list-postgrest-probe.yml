name: trade list PostgREST live probe

# Read-only verification of the trade list (region-first browse, search, filters, error path)
# against the real Supabase PostgREST with the public anon key. No writes. Results go to the
# job summary. Runs on pushes to the PR #47 branch that touch the list code, or manually.
on:
  workflow_dispatch:
  push:
    branches: ["claude/sweet-knuth-ahzm5c"]
    paths:
      - "lib/posts/**"
      - "lib/trade/**"
      - "vitest.trade-live.config.ts"
      - ".github/workflows/trade-list-postgrest-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live probe (read-only)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase secrets missing — live probe cannot run"; exit 1
          fi
          echo "probe target host: $(echo "$NEXT_PUBLIC_SUPABASE_URL" | sed -E 's#https?://([^/]+).*#\1#')" >> "$GITHUB_STEP_SUMMARY"
          npx vitest run --config vitest.trade-live.config.ts
