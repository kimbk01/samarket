# 운영 배포 직후 예열 (설계 M2 · docs/audit/app-entry-device-fail-root-cause-design-2026-11-17.md §22·§23)
#
# 원인(확인): 새 배포의 서버 함수가 비어 있는 상태라 배포 직후 첫 요청이 느리다.
#   Vercel `function_invocation.ttfb_ms` route `/` 5분 최대값 2.3~2.8초가 11-17 10:00~22:10 UTC 의
#   배포 시각과 모두 겹치고, 배포가 없던 11:25~18:15 UTC 에는 없음(평소 ttfb 200ms 안팎).
# 동작: Vercel 이 GitHub 에 남기는 배포 상태(success · environment=Production)를 받으면
#   운영 주소의 앱 첫 화면 경로를 3번씩 동시에 요청해 함수를 미리 깨운다.
#   (배포 고유 주소는 Vercel 인증으로 막혀 있어 운영 주소를 쓴다 — 상태 success 시각 = 배포 ready·운영 주소 연결 시각, 11-18 845daf0 실측)
# 금지 확인: next build 없음 · Vercel 배포·Redeploy 없음 · 결과를 기다리는 사람 없음(실패해도 아무 영향 없음).
name: post-deploy-warm

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: post-deploy-warm
  cancel-in-progress: true

jobs:
  warm:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Warm production routes
        env:
          BASE_URL: https://samarket.vercel.app
          UA: "Mozilla/5.0 (Linux; Android 14; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/131.0.0.0 Mobile Safari/537.36"
        run: |
          set -u
          for path in / /home /community-messenger; do
            for i in 1 2 3; do
              curl -s -o /dev/null --max-time 20 -A "$UA" \
                -w "${path} #${i} %{http_code} ttfb=%{time_starttransfer}s\n" \
                "${BASE_URL}${path}" &
            done
            wait
          done
