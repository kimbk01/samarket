apply plugin: 'com.android.application'

// Play upload signing — secrets from local-only android/key.properties (gitignored) or env.
// DO NOT put store/key passwords in this file.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.dibay.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dibay.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 86
        versionName "1.2.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
        }
        def kakaoNativeAppKey = (
            System.getenv("KAKAO_NATIVE_APP_KEY")
            ?: localProperties.getProperty("KAKAO_NATIVE_APP_KEY")
            ?: ""
        ).trim()
        if (kakaoNativeAppKey.isEmpty()) {
            logger.warn("KAKAO_NATIVE_APP_KEY is not set — Kakao native login will fail until configured (env or android/local.properties)")
        }
        resValue "string", "kakao_native_app_key", kakaoNativeAppKey
        resValue "string", "kakao_login_scheme", kakaoNativeAppKey ? "kakao${kakaoNativeAppKey}" : ""

        def googleWebClientId = (
            System.getenv("GOOGLE_WEB_CLIENT_ID")
            ?: localProperties.getProperty("GOOGLE_WEB_CLIENT_ID")
            ?: ""
        ).trim()
        if (googleWebClientId.isEmpty()) {
            logger.warn("GOOGLE_WEB_CLIENT_ID is not set — Google native login will fail until configured (env or android/local.properties)")
        }
        resValue "string", "google_web_client_id", googleWebClientId

        // Meta(Facebook) SDK — 앱 설치·실행 자동 기록(앱 홍보 광고 설치 측정). 설계: docs/audit/meta-android-sdk-design-2026-11-27.md
        // 값은 저장소에 두지 않는다(env 또는 android/local.properties). 비어 있으면 SDK 자동 초기화가 실패만 기록하고 앱은 계속 동작한다.
        def facebookAppId = (
            System.getenv("FACEBOOK_APP_ID")
            ?: localProperties.getProperty("FACEBOOK_APP_ID")
            ?: ""
        ).trim()
        def facebookClientToken = (
            System.getenv("FACEBOOK_CLIENT_TOKEN")
            ?: localProperties.getProperty("FACEBOOK_CLIENT_TOKEN")
            ?: ""
        ).trim()
        if (facebookAppId.isEmpty() || facebookClientToken.isEmpty()) {
            logger.warn("FACEBOOK_APP_ID / FACEBOOK_CLIENT_TOKEN not set — Meta app install events will not be sent (env or android/local.properties)")
        }
        resValue "string", "facebook_app_id", facebookAppId
        resValue "string", "facebook_client_token", facebookClientToken

        def supabaseUrl = (
            System.getenv("NEXT_PUBLIC_SUPABASE_URL")
            ?: localProperties.getProperty("NEXT_PUBLIC_SUPABASE_URL")
            ?: ""
        ).trim()
        def supabaseAnonKey = (
            System.getenv("NEXT_PUBLIC_SUPABASE_ANON_KEY")
            ?: localProperties.getProperty("NEXT_PUBLIC_SUPABASE_ANON_KEY")
            ?: ""
        ).trim()
        if (supabaseUrl.isEmpty() || supabaseAnonKey.isEmpty()) {
            logger.warn("NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY not set — Native Realtime upgrade broadcast will fail until configured (env or android/local.properties)")
        }
        resValue "string", "dibay_supabase_url", supabaseUrl
        resValue "string", "dibay_supabase_anon_key", supabaseAnonKey

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storeFilePath = (
                System.getenv("DIBAY_PLAY_STORE_FILE")
                ?: keystoreProperties["storeFile"]
                ?: ""
            ).toString().trim()
            def storePasswordValue = (
                System.getenv("DIBAY_PLAY_STORE_PASSWORD")
                ?: keystoreProperties["storePassword"]
                ?: ""
            ).toString()
            def keyAliasValue = (
                System.getenv("DIBAY_PLAY_KEY_ALIAS")
                ?: keystoreProperties["keyAlias"]
                ?: ""
            ).toString().trim()
            def keyPasswordValue = (
                System.getenv("DIBAY_PLAY_KEY_PASSWORD")
                ?: keystoreProperties["keyPassword"]
                ?: ""
            ).toString()
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // R8 난독화·축소 (Play 「DEX 난독화 1%」 해소 — docs/audit/android-r8-minify-plan-2026-11-15.md, Owner 승인 11-15)
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

// 운영 앱(release)은 반드시 운영 주소를 연다 — 다른 주소가 들어가 있으면 빌드 실패(스토어에 다른 서버 주소 앱이 올라가는 것 차단).
def dibayProductionServerUrl = "https://samarket.vercel.app"
def verifyDibayReleaseServerUrl = tasks.register("verifyDibayReleaseServerUrl") {
    def src = file("src/main/assets/capacitor.config.json")
    inputs.file(src)
    doLast {
        def url = (new groovy.json.JsonSlurper().parse(src).server?.url ?: "").toString().replaceAll('/+$', '')
        if (url != dibayProductionServerUrl) {
            throw new GradleException("release 빌드 서버 주소가 운영(${dibayProductionServerUrl})이 아닙니다: ${url} — npm run cap:sync:vercel 로 다시 맞추세요")
        }
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach { dependsOn verifyDibayReleaseServerUrl }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:1.9.0"
    // INTRO launchEpoch: WebViewCompat.addDocumentStartJavaScript (same version Capacitor ships)
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.kakao.sdk:v2-user:2.20.1"
    implementation "com.google.android.gms:play-services-auth:21.3.0"
    // Google Play In-App Updates (official App Update API)
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.firebase:firebase-messaging:24.1.0"
    // Meta SDK 핵심(Analytics) 만 — 로그인·공유 없음. 앱 설치·실행 자동 기록용
    implementation "com.facebook.android:facebook-core:19.0.1"
    implementation "io.agora.rtc:full-sdk:4.6.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // 채팅 영상 압축(H.264/AAC mp4) — docs/audit/messenger-video-send-audit-design-2026-11-24.md §3-6
    implementation "androidx.media3:media3-transformer:1.8.0"
    implementation "androidx.media3:media3-effect:1.8.0"
    implementation "androidx.media3:media3-common:1.8.0"
    // B1: 앱 아이콘 숫자를 Samsung badge provider 에도 쓴다 (@capawesome/capacitor-badge 와 같은 버전)
    implementation "me.leolin:ShortcutBadger:1.1.22@aar"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
