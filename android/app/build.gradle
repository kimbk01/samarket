apply plugin: 'com.android.application'

// Play upload signing — secrets from local-only android/key.properties (gitignored) or env.
// DO NOT put store/key passwords in this file.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.dibay.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dibay.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 39
        versionName "1.2.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
        }
        def kakaoNativeAppKey = (
            System.getenv("KAKAO_NATIVE_APP_KEY")
            ?: localProperties.getProperty("KAKAO_NATIVE_APP_KEY")
            ?: ""
        ).trim()
        if (kakaoNativeAppKey.isEmpty()) {
            logger.warn("KAKAO_NATIVE_APP_KEY is not set — Kakao native login will fail until configured (env or android/local.properties)")
        }
        resValue "string", "kakao_native_app_key", kakaoNativeAppKey
        resValue "string", "kakao_login_scheme", kakaoNativeAppKey ? "kakao${kakaoNativeAppKey}" : ""

        def googleWebClientId = (
            System.getenv("GOOGLE_WEB_CLIENT_ID")
            ?: localProperties.getProperty("GOOGLE_WEB_CLIENT_ID")
            ?: ""
        ).trim()
        if (googleWebClientId.isEmpty()) {
            logger.warn("GOOGLE_WEB_CLIENT_ID is not set — Google native login will fail until configured (env or android/local.properties)")
        }
        resValue "string", "google_web_client_id", googleWebClientId

        def supabaseUrl = (
            System.getenv("NEXT_PUBLIC_SUPABASE_URL")
            ?: localProperties.getProperty("NEXT_PUBLIC_SUPABASE_URL")
            ?: ""
        ).trim()
        def supabaseAnonKey = (
            System.getenv("NEXT_PUBLIC_SUPABASE_ANON_KEY")
            ?: localProperties.getProperty("NEXT_PUBLIC_SUPABASE_ANON_KEY")
            ?: ""
        ).trim()
        if (supabaseUrl.isEmpty() || supabaseAnonKey.isEmpty()) {
            logger.warn("NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY not set — Native Realtime upgrade broadcast will fail until configured (env or android/local.properties)")
        }
        resValue "string", "dibay_supabase_url", supabaseUrl
        resValue "string", "dibay_supabase_anon_key", supabaseAnonKey

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storeFilePath = (
                System.getenv("DIBAY_PLAY_STORE_FILE")
                ?: keystoreProperties["storeFile"]
                ?: ""
            ).toString().trim()
            def storePasswordValue = (
                System.getenv("DIBAY_PLAY_STORE_PASSWORD")
                ?: keystoreProperties["storePassword"]
                ?: ""
            ).toString()
            def keyAliasValue = (
                System.getenv("DIBAY_PLAY_KEY_ALIAS")
                ?: keystoreProperties["keyAlias"]
                ?: ""
            ).toString().trim()
            def keyPasswordValue = (
                System.getenv("DIBAY_PLAY_KEY_PASSWORD")
                ?: keystoreProperties["keyPassword"]
                ?: ""
            ).toString()
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // 「DIBAY 개발」 — USB 설치 전용 스테이징 앱 (Owner 2026-11-10 「푸시 끄고 진행」, docs/staging-dev-app-design.md).
        // 운영 앱(com.dibay.app)과 나란히 설치되고, 스테이징 주소(최신 main · 회원 미공개)를 연다.
        // 푸시 기기 등록은 서버가 스테이징 주소에서 저장하지 않는다(staging-host-push-register-skip).
        // 빌드: cd android && ./gradlew assembleStaging → adb -d install -r app/build/outputs/apk/staging/app-staging.apk
        staging {
            initWith debug
            applicationIdSuffix ".dev"
            versionNameSuffix "-staging"
            matchingFallbacks = ['debug']
            // 카카오 개발용 네이티브 앱 키 「DIBAY 개발 (USB 설치 전용)」 — 운영 키와 분리 (네이티브 앱 키는 APK 에 공개되는 값)
            resValue "string", "kakao_native_app_key", "7ef4e5c9b1661536ec1edc285c858af0"
            resValue "string", "kakao_login_scheme", "kakao7ef4e5c9b1661536ec1edc285c858af0"
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

// 「DIBAY 개발」: cap sync 가 만든 capacitor.config.json 을 복사해 server.url 만 스테이징 주소로 바꾼다.
// (운영 assets 는 그대로 — staging 빌드 종류의 assets 가 같은 파일을 덮는다)
def dibayStagingServerUrl = "https://samarket-git-main-kimbk01s-projects.vercel.app"
// Vercel 보호 우회 비밀값(Owner 허용 2026-11-10) — android/local.properties 또는 env 에만 둔다(Git 금지).
// 첫 화면 주소에만 붙여 Vercel 이 우회 쿠키를 심게 한다 → 이후 같은 주소의 화면·API 는 쿠키로 열림.
def dibayStagingBypassSecret = {
    def lp = new Properties()
    def lpf = rootProject.file("local.properties")
    if (lpf.exists()) lpf.withInputStream { lp.load(it) }
    (System.getenv("DIBAY_STAGING_BYPASS_SECRET") ?: lp.getProperty("DIBAY_STAGING_BYPASS_SECRET") ?: "").trim()
}()
def dibayStagingStartUrl = dibayStagingBypassSecret
    ? "${dibayStagingServerUrl}/?x-vercel-protection-bypass=${dibayStagingBypassSecret}&x-vercel-set-bypass-cookie=samesitenone"
    : dibayStagingServerUrl
if (!dibayStagingBypassSecret) {
    logger.warn("DIBAY_STAGING_BYPASS_SECRET is not set — 「DIBAY 개발」 앱은 Vercel 로그인 화면에서 막힙니다 (android/local.properties)")
}
def dibayStagingAssetsDir = new File(buildDir, "generated/dibay-staging-assets")
android.sourceSets.staging.assets.srcDirs += [dibayStagingAssetsDir]
def generateDibayStagingCapacitorConfig = tasks.register("generateDibayStagingCapacitorConfig") {
    def src = file("src/main/assets/capacitor.config.json")
    inputs.file(src)
    inputs.property("serverUrl", dibayStagingStartUrl)
    outputs.dir(dibayStagingAssetsDir)
    doLast {
        def json = new groovy.json.JsonSlurper().parse(src)
        json.server.url = dibayStagingStartUrl
        // 스테이징은 Vercel 로그인(팀원만)으로 보호됨 — 로그인 화면을 앱 밖 브라우저가 아니라 앱 안에서 열어야 로그인 쿠키가 앱에 남는다.
        def nav = (json.server.allowNavigation ?: []) as List
        ["vercel.com", "*.vercel.com"].each { if (!nav.contains(it)) nav << it }
        json.server.allowNavigation = nav
        dibayStagingAssetsDir.mkdirs()
        new File(dibayStagingAssetsDir, "capacitor.config.json").text =
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
    }
}
tasks.matching { it.name == "mergeStagingAssets" }.configureEach { dependsOn generateDibayStagingCapacitorConfig }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:1.9.0"
    // INTRO launchEpoch: WebViewCompat.addDocumentStartJavaScript (same version Capacitor ships)
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.kakao.sdk:v2-user:2.20.1"
    implementation "com.google.android.gms:play-services-auth:21.3.0"
    // Google Play In-App Updates (official App Update API)
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.firebase:firebase-messaging:24.1.0"
    implementation "io.agora.rtc:full-sdk:4.6.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // B1: 앱 아이콘 숫자를 Samsung badge provider 에도 쓴다 (@capawesome/capacitor-badge 와 같은 버전)
    implementation "me.leolin:ShortcutBadger:1.1.22@aar"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
